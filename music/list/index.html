<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8"/>
    <title>加载中... - 冰豆直播</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px; color: #999; background-color: #000; overflow: hidden;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        a { color: #ccc; text-decoration: none; outline: none; transition: color 0.2s; }
        a:hover { color: #fff; }
        .active { color: #ff4d4f !important; }
        .app-container { display: flex; flex-direction: column; height: 100%; background-color: #23262E; }
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            height: 40px; padding: 0 10px; background-color: #202020; z-index: 10;
        }
        .category-name { color: #fcfcfc; }
        .main-content { flex-grow: 1; position: relative; }
        #listplayer { width: 100%; height: 100%; border: none; background-color: #000; }
        .side-menu-toggle { cursor: pointer; color: #99cc00; }
        .side-menu-container { 
            position: fixed; top: 40px; right: -300px; width: 300px; height: calc(100% - 40px);
            background-color: #202020; padding: 15px; z-index: 20;
            overflow-y: auto; 
            transition: right 0.3s ease-in-out;
        }
        .side-menu-container.is-open { right: 0; }
        .side-menu-container h2 { 
            color: #fcfcfc; font-size: 16px; margin-bottom: 15px; 
            letter-spacing: 1px; text-transform: uppercase;
        }
        .menu-link { 
            display: block; padding: 8px 5px; color: #ccc; border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .menu-link:hover { color: #fff; background-color: #2a2a2a; }
        .menu-link svg { margin-right: 8px; vertical-align: middle; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>
<div class="app-container">
    <header class="header">
        <div class="category-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
            <span id="category-name" class="category-name">加载中...</span>
        </div>
        <div id="sideMenuToggle" class="side-menu-toggle">
            [切换歌单]
        </div>
    </header>
    <main class="main-content">
        <iframe id="listplayer" name="listplayer" src="" allowfullscreen allowtransparency="true"></iframe>
    </main>
    <aside id="sideMenuContainer" class="side-menu-container">
        <h2>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
            歌单选择
        </h2>
        <div id="playlist-content">
            <p style="color: #999;">正在加载歌单...</p>
        </div>
    </aside>
</div>
<script defer>
    const categoryEl = document.getElementById('category-name');
    const playlistContentEl = document.getElementById('playlist-content');
    const listplayerIframe = document.getElementById('listplayer');
    const sideMenuToggleEl = document.getElementById('sideMenuToggle');
    const sideMenuContainerEl = document.getElementById('sideMenuContainer');
    function toggleSideMenu() {
        sideMenuContainerEl.classList.toggle('is-open');
    }

    function handlePlaylistClick(event) {
        const link = event.target.closest('.menu-link');
        if (!link) return;
        event.preventDefault();
        playlistContentEl.querySelectorAll('.menu-link').forEach(el => el.classList.remove('active'));
        link.classList.add('active');
        listplayerIframe.src = link.href;
    }

    async function loadPlaylist() {
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat');

        if (!cat) {
            categoryEl.textContent = '未指定分类';
            playlistContentEl.innerHTML = '<p style="color: #ff4d4f;">错误：请在网址后提供分类参数 (例如 ?cat=your_category)</p>';
            return;
        }

        document.title = `${cat} - 冰豆直播`;
        categoryEl.textContent = cat;

        const apiUrl = `https://json.bingdou.cc/music/list/?cat=${encodeURIComponent(cat)}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`API请求失败，状态码: ${response.status}`);
            
            const data = await response.json();

            if (data?.data?.length > 0) {
                let listHtml = '';
                let firstId = null;

                data.data.forEach((item, index) => {
                    const liveId = item.id || 'unknown';
                    const title = item.title || '无标题';
                    const id = `playlist-${index}`;

                    if (index === 0) firstId = liveId;

                    listHtml += `
                        <a id="${id}" class="menu-link" href="../?id=${liveId}" title="${title}" target="listplayer">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            ${title}
                        </a>
                    `;
                });

                playlistContentEl.innerHTML = listHtml;
                
                if (firstId) {
                    listplayerIframe.src = `../?id=${firstId}`;
                    document.getElementById('playlist-0')?.classList.add('active');
                }
            } else {
                throw new Error('未找到歌单数据');
            }
        } catch (error) {
            console.error('加载歌单失败:', error);
            playlistContentEl.innerHTML = `<p style="color: #ff4d4f;">加载数据失败: ${error.message}</p>`;
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        sideMenuToggleEl.addEventListener('click', toggleSideMenu);
        playlistContentEl.addEventListener('click', handlePlaylistClick);
        loadPlaylist();
    });
</script>
<script type="text/javascript" src="https://js.users.51.la/21659431.js"></script>
</body>
</html>

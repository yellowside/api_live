<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8"/>
    <meta name="referrer" content="no-referrer"/>
    <title>Music - 冰豆直播</title>
    
    <!-- 播放器核心CSS，保留 -->
    <link rel="stylesheet" href="https://cdnjs.misidao.cn/ajax/libs/aplayer/1.10.1/APlayer.min.css">
    
    <style>
        /* 基础样式和加载动画 */
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* 加载指示器 */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px; /* APlayer的大致高度 */
            font-size: 14px;
            color: #aaa;
        }
        .loader::after {
            content: '';
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #aaa;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar{width: 12px;height: 12px;}
        ::-webkit-scrollbar-track{border-radius: 8px; background-color: rgba(225,255,255,.1);}
        ::-webkit-scrollbar-thumb{border-radius: 8px; background-color: rgba(23,124,176,.8);}
        ::-webkit-scrollbar-thumb:hover{background-color: rgba(255,78,32,.8);}
    </style>
</head>
<body oncontextmenu="return false">

<!-- 播放器容器，初始显示加载动画 -->
<div id="aplayer-container">
    <div class="loader">数据加载中</div>
</div>

<!-- 页脚容器 -->
<div id="foot"></div>

<!-- 播放器核心JS，使用defer，不阻塞渲染 -->
<script src="https://cdnjs.misidao.cn/ajax/libs/aplayer/1.10.1/APlayer.min.js" defer></script>

<!-- 所有自定义逻辑合并到一个脚本中，也使用defer -->
<script defer>
    // --- DOM 元素引用 ---
    const aplayerContainer = document.getElementById('aplayer-container');
    const footContainer = document.getElementById('foot');

    // --- 功能函数 ---

    /**
     * 异步加载页脚内容
     * 使用原生 fetch API 替代 jQuery 的 $.load()
     */
    async function loadFooter() {
        try {
            const response = await fetch('../foot.html');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            footContainer.innerHTML = await response.text();
        } catch (error) {
            console.error("加载页脚失败:", error);
            footContainer.innerHTML = '<p style="text-align:center; padding: 10px; color: #666;">页脚加载失败</p>';
        }
    }

    /**
     * 从API获取音乐数据并初始化播放器
     */
    async function initPlayer() {
        const urlParams = new URLSearchParams(window.location.search);
        const musicId = urlParams.get('id');

        if (!musicId) {
            aplayerContainer.innerHTML = '<h1>错误：未提供音乐ID</h1>';
            return;
        }

        const apiUrl = `https://json.bingdou.cc/music/?id=${encodeURIComponent(musicId)}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error(`网络请求失败，状态码: ${response.status}`);
            }
            
            const data = await response.json();
            if (!data || !data.data || !Array.isArray(data.data)) {
                throw new Error('返回的数据格式不正确');
            }
            
            const audioList = data.data.map(item => ({
                name: item.name || '未知歌曲',
                artist: item.artist || '未知歌手',
                url: item.url,
                cover: item.pic, // APlayer使用 cover 而不是 pic
                lrc: item.lrc
            }));
            
            if (audioList.length === 0) {
                throw new Error('歌单为空');
            }

            // 清除加载动画，创建播放器实例
            aplayerContainer.innerHTML = ''; // 清空容器
            const ap = new APlayer({
                container: aplayerContainer,
                fixed: false,
                mini: false,
                volume: 0.7,
                preload: 'auto',
                mutex: true,
                autoplay: true,
                listFolded: false,
                listMaxHeight: '350px', // 建议设置一个最大高度，而不是100%
                lrcType: 3,
                audio: audioList
            });

        } catch (error) {
            console.error('初始化播放器失败:', error);
            aplayerContainer.innerHTML = `<h1>加载失败: ${error.message}</h1>`;
        }
    }

    // --- 初始化 ---
    // 因为使用了 defer，此脚本会在DOM解析完成后执行
    // 所以无需再监听 DOMContentLoaded 事件
    initPlayer();
    loadFooter();
</script>
</body>
</html>

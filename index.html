<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
<meta name="viewport" content="width=device-width,initial-scale=1.0, user-scalable=no">
<title>API</title>
<style>
* {box-sizing:border-box;margin:0;padding:0;}
html,body {width:100%;height:100%;overflow:hidden;}
body {font-size:12px;background-color:#000;font-family:sans-serif;}
iframe {border:none;display:block;}
.app-container {display:flex;width:100%;height:100%;}
.main-content {flex-grow:1;}
.sidebar {width:180px;height:100%;background-color:#171a1d;position:relative;transition:margin-right 0.3s ease-in-out;}
.sidebar.is-collapsed {margin-right:-180px;}
.sidebar-toggle {position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:20px;height:60px;background-color:#171a1d;cursor:pointer;display:flex;align-items:center;justify-content:center;border-top-left-radius:5px;border-bottom-left-radius:5px;}
.sidebar-toggle:hover {background-color:#333;}
.sidebar-toggle svg {width:12px;height:12px;fill:#ccc;transition:transform 0.3s;}
.sidebar.is-collapsed .sidebar-toggle svg {transform:rotate(180deg);}
#welcome a {color:red;}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false">
<div class="app-container">
    <main class="main-content">
        <iframe id="play" name="play" src="./huya/?id=11342412&name=周星驰系列" width="100%" height="100%" scrolling="no" allowtransparency="true"></iframe>
    </main>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-toggle" id="sidebarToggle">
            <svg viewBox="0 0 24 24">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </div>
        <iframe id="tvl" name="tvl" src="./list/" width="100%" height="100%" scrolling="auto" target="play" allowtransparency="true"></iframe>
    </aside>
</div>
<script defer>
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const playFrame = document.getElementById('play');
    const tvListFrame = document.getElementById('tvl');

    function toggleSidebar() {
        sidebar.classList.toggle('is-collapsed');
    }

    function preventContextMenu(e) {
        e.preventDefault();
    }

    function handleKeyDown(e) {
        try {
            const playFrameContent = playFrame.contentWindow || playFrame.contentDocument;
            if (playFrameContent && typeof playFrameContent.keyDown === 'function') {
                playFrameContent.keyDown(e.keyCode);
            }
        } catch (error) {
        }
    }

    document.addEventListener('DOMContentLoaded', () => {

        sidebarToggle.addEventListener('click', toggleSidebar);
        document.addEventListener('contextmenu', preventContextMenu);
        document.addEventListener('keydown', handleKeyDown);
    });
</script>
<script async src="https://js.users.51.la/21659431.js"></script>
</body>
</html>

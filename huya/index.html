<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>冰豆直播</title>
<style>
* {box-sizing:border-box;margin:0;padding:0;}
html,body {width:100%;height:100%;}
body {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:#999;background-color:#000;overflow:hidden;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
a {text-decoration:none;}
.app-container {display:flex;flex-direction:column;height:100%;background-color:#23262E;}
.header {display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 10px;background-color:#202020;z-index:10;}
.video-info {display:flex;align-items:center;flex-shrink:1;min-width:0;overflow:hidden;}
.video-title {color:#fcfcfc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.main-content {flex-grow:1;position:relative;}
#player-iframe {width:100%;height:100%;border:none;background-color:#000;}
.side-menu-toggle {cursor:pointer;color:#99cc00;white-space:nowrap;}
.side-menu-container {position:fixed;top:40px;right:-130px;width:130px;height:calc(100% - 40px);background-color:#202020;padding:10px;z-index:20;overflow-y:auto;transition:right 0.3s ease-in-out;}
.side-menu-container.is-open {right:0;}
.side-menu-container h2 {color:#fcfcfc;font-size:16px;margin-bottom:15px;letter-spacing:1px;text-transform:uppercase;}
.line-link {display:block;padding:8px 5px;color:#ccc;border-bottom:1px solid #333;font-size:13px;cursor:pointer;}
.line-link:hover {color:#fff;background-color:#2a2a2a;}
.line-link.active {color:#ff4d4f;}
.line-link svg {margin-right:8px;vertical-align:middle;}
::-webkit-scrollbar {width:8px;}
::-webkit-scrollbar-track {background:#1e1e1e;}
::-webkit-scrollbar-thumb {background:#555;border-radius:4px;}
::-webkit-scrollbar-thumb:hover {background:#777;}
@media (max-width:768px) {body {font-size:16px;}
.header {padding:0 15px;}
.side-menu-container {width:80vw;max-width:280px;}
.line-link {padding:12px 8px;font-size:15px;}
} 
</style>
</head>
<body oncontextmenu="return false">
<div class="app-container">
    <header class="header">
        <div class="video-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" />
            </svg>
            <span id="video-title" class="video-title">正在加载...</span>
        </div>
        <div id="sideMenuToggle" class="side-menu-toggle">
            [切换线路]
        </div>
    </header>
    <main class="main-content">
        <iframe id="player-iframe" src="" allowfullscreen allowtransparency="true"></iframe>
    </main>
    <aside id="sideMenuContainer" class="side-menu-container">
        <h2>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
            </svg>
            线路选择
        </h2>
        <div id="line-list"></div>
    </aside>
</div>
<script defer>
    // --- DOM 元素引用 ---
    const videoTitleEl = document.getElementById('video-title');
    const playerIframe = document.getElementById('player-iframe');
    const sideMenuToggleEl = document.getElementById('sideMenuToggle');
    const sideMenuContainerEl = document.getElementById('sideMenuContainer');
    const lineListEl = document.getElementById('line-list');

    // --- 功能函数 ---

    /**
     * 切换侧边栏显示/隐藏
     */
    function toggleSideMenu() {
        sideMenuContainerEl.classList.toggle('is-open');
    }

    /**
     * 处理线路链接点击事件 (事件委托)
     * @param {Event} event
     */
    function handleLineClick(event) {
        const link = event.target.closest('.line-link');
        if (!link) return;

        event.preventDefault();

        // 更新 iframe src
        playerIframe.src = link.href;

        // 更新高亮状态
        lineListEl.querySelectorAll('.line-link').forEach(el => el.classList.remove('active'));
        link.classList.add('active');
        
        // 在移动端可以自动关闭侧边栏
        // sideMenuContainerEl.classList.remove('is-open');
    }

    /**
     * 初始化页面数据
     */
    async function initPage() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        if (!videoId) {
            videoTitleEl.textContent = '无效的视频ID';
            return;
        }

        try {
            const response = await fetch(`https://json.bingdou.cc/huya/?id=${videoId}`);
            if (!response.ok) throw new Error(`网络请求失败，状态码: ${response.status}`);
            
            const data = await response.json();
            const title = data.title || '未知名称';
            const lines = data.data || [];

            // 设置标题
            document.title = `${title} - 冰豆直播`;
            videoTitleEl.textContent = title;

            if (lines.length > 0) {
                // 渲染线路列表
                let listHtml = '';
                lines.forEach((item, index) => {
                    const encodedUrl = btoa(item.url);
                    const isActive = index === 0 ? 'active' : '';
                    listHtml += `
                        <a class="line-link ${isActive}" href="https://player.bot.cd/live/?url=${encodedUrl}" target="player-iframe">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            ${item.title}
                        </a>
                    `;
                });
                lineListEl.innerHTML = listHtml;

                // 设置默认播放器链接
                playerIframe.src = lines[0].url ? `https://player.bot.cd/live/?url=${btoa(lines[0].url)}` : 'about:blank';
            } else {
                throw new Error('没有可用的播放线路');
            }

        } catch (error) {
            console.error("获取数据失败:", error);
            videoTitleEl.textContent = '加载失败';
        }
    }

    // --- 初始化 ---
    // 因为使用了 defer，此脚本会在DOM解析完成后执行
    sideMenuToggleEl.addEventListener('click', toggleSideMenu);
    lineListEl.addEventListener('click', handleLineClick);
    
    initPage();
</script>
<script src="https://js.users.51.la/21659431.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在加载 - 冰豆直播</title>
<style>
* {box-sizing:border-box;margin:0;padding:0;}
html,body {width:100%;height:100%;}
body {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:#999;background-color:#000;overflow:hidden;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
a {text-decoration:none;}
.app-container {display:flex;flex-direction:column;height:100%;background-color:#23262E;}
.header {display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 10px;background-color:#202020;z-index:10;}
.channel-name {color:#fcfcfc;}
.main-content {flex-grow:1;position:relative;}
#player-frame {width:100%;height:100%;border:none;background-color:#000;}
.side-menu-toggle {cursor:pointer;color:#99cc00;}
.side-menu-container {position:fixed;top:40px;right:-300px;width:300px;height:calc(100% - 40px);background-color:#202020;padding:15px;z-index:20;overflow-y:auto;transition:right 0.3s ease-in-out;}
.side-menu-container.is-open {right:0;}
.side-menu-container h2 {color:#fcfcfc;font-size:16px;margin-bottom:15px;letter-spacing:1px;text-transform:uppercase;}
.menu-link {display:block;padding:10px 8px;color:#ccc;border-bottom:1px solid #333;font-size:13px;cursor:pointer;}
.menu-link:hover {color:#fff;background-color:#2a2a2a;}
.menu-link.active {color:#ff4d4f;}
.menu-link svg {margin-right:8px;vertical-align:middle;}
::-webkit-scrollbar {width:8px;}
::-webkit-scrollbar-track {background:#1e1e1e;}
::-webkit-scrollbar-thumb {background:#555;border-radius:4px;}
::-webkit-scrollbar-thumb:hover {background:#777;}
@media (max-width:768px) {body {font-size:16px;}
.header {padding:0 15px;}
.side-menu-container {width:80vw;max-width:280px;}
.menu-link {padding:12px 8px;font-size:15px;}
}
</style>
</head>
<body oncontextmenu="return false">
<div class="app-container">
    <header class="header">
        <div class="channel-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
            <span id="channel-name" class="channel-name">正在加载...</span>
        </div>
        <div id="sideMenuToggle" class="side-menu-toggle">
            [切换频道]
        </div>
    </header>
    <main class="main-content">
        <iframe id="player-frame" name="listplayer" src="" allowfullscreen allowtransparency="true"></iframe>
    </main>
    <aside id="sideMenuContainer" class="side-menu-container">
        <h2>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
            频道选择
        </h2>
        <div id="playlist">
            <p style="color: #999;">正在加载频道列表...</p>
        </div>
    </aside>
</div>
<script defer>
    // --- DOM 元素引用 ---
    const channelNameEl = document.getElementById('channel-name');
    const playerFrame = document.getElementById('player-frame');
    const sideMenuToggleEl = document.getElementById('sideMenuToggle');
    const sideMenuContainerEl = document.getElementById('sideMenuContainer');
    const playlistEl = document.getElementById('playlist');

    // --- 功能函数 ---

    /**
     * 切换侧边栏显示/隐藏
     */
    function toggleSideMenu() {
        sideMenuContainerEl.classList.toggle('is-open');
    }

    /**
     * 处理频道链接点击事件 (事件委托)
     * @param {Event} event
     */
    function handlePlaylistClick(event) {
        const link = event.target.closest('.menu-link');
        if (!link) return;

        event.preventDefault();

        // 更新 iframe src
        playerFrame.src = link.href;

        // 更新高亮状态
        playlistEl.querySelectorAll('.menu-link').forEach(el => el.classList.remove('active'));
        link.classList.add('active');
        
        // 在移动端，选择后自动关闭侧边栏
        if (window.innerWidth <= 768) {
            sideMenuContainerEl.classList.remove('is-open');
        }
    }

    /**
     * 异步加载频道列表
     */
    async function loadChannelList() {
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('id');
        const channelName = urlParams.get('name');

        if (!channelId) {
            playlistEl.innerHTML = '<p style="color: #ff4d4f;">错误：缺少频道ID参数</p>';
            return;
        }

        // 设置页面标题和栏目标题
        if (channelName) {
            document.title = `${channelName} - 冰豆直播`;
            channelNameEl.textContent = channelName;
        } else {
            channelNameEl.textContent = '未知频道';
        }

        const apiUrl = `https://json.bingdou.cc/huya/list/?id=${encodeURIComponent(channelId)}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`网络请求失败，状态码: ${response.status}`);
            
            const data = await response.json();
            if (!data?.data?.datas || !Array.isArray(data.data.datas)) {
                throw new Error("返回的数据格式不正确");
            }
            
            const channels = data.data.datas;
            if (channels.length === 0) {
                throw new Error("该频道下没有可用的直播间");
            }

            let listHtml = '';
            let firstUrl = '';

            channels.forEach((item, index) => {
                const roomId = item.profileRoom;
                const title = item.introduction || '无标题';
                const url = `../?id=${roomId}`;
                
                if (index === 0) {
                    firstUrl = url;
                }

                listHtml += `
                    <a class="menu-link ${index === 0 ? 'active' : ''}" href="${url}" title="${title}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        ${title}
                    </a>
                `;
            });

            playlistEl.innerHTML = listHtml;
            playerFrame.src = firstUrl;

        } catch (error) {
            console.error("加载频道列表失败:", error);
            playlistEl.innerHTML = `<p style="color: #ff4d4f;">加载失败: ${error.message}</p>`;
        }
    }

    // --- 初始化 ---
    // 因为使用了 defer，此脚本会在DOM解析完成后执行
    sideMenuToggleEl.addEventListener('click', toggleSideMenu);
    playlistEl.addEventListener('click', handlePlaylistClick);
    
    loadChannelList();
</script>
<script src="https://js.users.51.la/21659431.js"></script>
</body>
</html>
